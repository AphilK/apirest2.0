services:
  fastapi:
    build: .
    image: python:3.14-slim
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - HOST=db
      - PORT=${PORT}
      - POSTGRES_DB=${POSTGRES_DB}
    container_name: fastapi_rest
    ports:
      - "80:80"

    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./
          target: /app/
          ignore:
            - compose.yaml
            - Dockerfile
            - README.md
        - action: rebuild
          path: ./app/src/backend/main.py    
        
  db:
    image: postgres:19rc1-trixie
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PORT=${PORT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
