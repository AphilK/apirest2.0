[project]
name = "apirest2-0"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "python-dotenv",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
]

[tool.fastapi]
entrypoint = "src.backend.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
